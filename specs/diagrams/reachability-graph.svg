<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <defs>
    <style>
      .title { font: bold 20px sans-serif; fill: #1a1a2e; }
      .node-label { font: bold 11px sans-serif; fill: white; }
      .node-type { font: 9px sans-serif; fill: #ccc; }
      .edge-label { font: 10px sans-serif; fill: #666; }
      .legend-text { font: 11px sans-serif; fill: #333; }
      .entry-node { fill: #e94560; }
      .component-node { fill: #0f3460; }
      .handler-node { fill: #16213e; }
      .function-node { fill: #1a1a2e; }
      .route-node { fill: #533483; }
      .dead-node { fill: #ff6b6b; stroke: #c0392b; stroke-width: 3; stroke-dasharray: 5,3; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a4a6a" />
    </marker>
    <marker id="arrow-dead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c0392b" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="700" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="500" y="35" text-anchor="middle" class="title">Reachability Graph Example: Dead Handler Detection</text>

  <!-- Entry Point -->
  <g transform="translate(100, 100)">
    <ellipse cx="50" cy="30" rx="50" ry="30" class="entry-node"/>
    <text x="50" y="28" text-anchor="middle" class="node-label">index.tsx</text>
    <text x="50" y="42" text-anchor="middle" class="node-type">ENTRY_POINT</text>
  </g>

  <!-- App Component -->
  <g transform="translate(250, 180)">
    <rect x="0" y="0" width="120" height="60" rx="8" class="component-node"/>
    <text x="60" y="25" text-anchor="middle" class="node-label">App</text>
    <text x="60" y="42" text-anchor="middle" class="node-type">COMPONENT</text>
  </g>

  <!-- Dashboard Component -->
  <g transform="translate(100, 300)">
    <rect x="0" y="0" width="120" height="60" rx="8" class="component-node"/>
    <text x="60" y="25" text-anchor="middle" class="node-label">Dashboard</text>
    <text x="60" y="42" text-anchor="middle" class="node-type">COMPONENT</text>
  </g>

  <!-- Settings Component -->
  <g transform="translate(400, 300)">
    <rect x="0" y="0" width="120" height="60" rx="8" class="component-node"/>
    <text x="60" y="25" text-anchor="middle" class="node-label">Settings</text>
    <text x="60" y="42" text-anchor="middle" class="node-type">COMPONENT</text>
  </g>

  <!-- handleSave Handler (BOUND) -->
  <g transform="translate(100, 430)">
    <rect x="0" y="0" width="120" height="60" rx="8" class="handler-node"/>
    <text x="60" y="25" text-anchor="middle" class="node-label">handleSave</text>
    <text x="60" y="42" text-anchor="middle" class="node-type">HANDLER</text>
  </g>

  <!-- handleRefresh Handler (BOUND) -->
  <g transform="translate(250, 430)">
    <rect x="0" y="0" width="120" height="60" rx="8" class="handler-node"/>
    <text x="60" y="25" text-anchor="middle" class="node-label">handleRefresh</text>
    <text x="60" y="42" text-anchor="middle" class="node-type">HANDLER</text>
  </g>

  <!-- handleDelete Handler (DEAD - NOT BOUND) -->
  <g transform="translate(550, 430)">
    <rect x="0" y="0" width="130" height="60" rx="8" class="dead-node"/>
    <text x="65" y="25" text-anchor="middle" class="node-label" fill="#c0392b">handleDelete</text>
    <text x="65" y="42" text-anchor="middle" class="node-type" fill="#e74c3c">HANDLER (DEAD)</text>
  </g>

  <!-- saveData Function -->
  <g transform="translate(100, 560)">
    <rect x="0" y="0" width="120" height="50" rx="8" class="function-node"/>
    <text x="60" y="22" text-anchor="middle" class="node-label">saveData</text>
    <text x="60" y="38" text-anchor="middle" class="node-type">FUNCTION</text>
  </g>

  <!-- fetchData Function -->
  <g transform="translate(250, 560)">
    <rect x="0" y="0" width="120" height="50" rx="8" class="function-node"/>
    <text x="60" y="22" text-anchor="middle" class="node-label">fetchData</text>
    <text x="60" y="38" text-anchor="middle" class="node-type">FUNCTION</text>
  </g>

  <!-- deleteItem Function (DEAD - called only by dead handler) -->
  <g transform="translate(550, 560)">
    <rect x="0" y="0" width="130" height="50" rx="8" class="dead-node"/>
    <text x="65" y="22" text-anchor="middle" class="node-label" fill="#c0392b">deleteItem</text>
    <text x="65" y="38" text-anchor="middle" class="node-type" fill="#e74c3c">FUNCTION (DEAD)</text>
  </g>

  <!-- Edges -->
  <!-- Entry → App (RENDERS) -->
  <path d="M 150 145 L 310 180" stroke="#4a4a6a" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="220" y="155" class="edge-label">renders</text>

  <!-- App → Dashboard (RENDERS) -->
  <path d="M 280 240 L 195 300" stroke="#4a4a6a" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="220" y="265" class="edge-label">renders</text>

  <!-- App → Settings (RENDERS) -->
  <path d="M 340 240 L 430 300" stroke="#4a4a6a" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="380" y="265" class="edge-label">renders</text>

  <!-- Dashboard → handleSave (BINDS) -->
  <path d="M 160 360 L 160 430" stroke="#4a4a6a" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="170" y="395" class="edge-label">binds</text>

  <!-- Dashboard → handleRefresh (BINDS) -->
  <path d="M 200 360 L 280 430" stroke="#4a4a6a" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="250" y="390" class="edge-label">binds</text>

  <!-- handleSave → saveData (CALLS) -->
  <path d="M 160 490 L 160 560" stroke="#4a4a6a" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="170" y="525" class="edge-label">calls</text>

  <!-- handleRefresh → fetchData (CALLS) -->
  <path d="M 310 490 L 310 560" stroke="#4a4a6a" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="320" y="525" class="edge-label">calls</text>

  <!-- handleDelete → deleteItem (CALLS) - DEAD PATH -->
  <path d="M 615 490 L 615 560" stroke="#c0392b" stroke-width="2" stroke-dasharray="5,3" fill="none" marker-end="url(#arrow-dead)"/>
  <text x="625" y="525" class="edge-label" fill="#c0392b">calls (dead)</text>

  <!-- Missing edge indicator -->
  <g transform="translate(460, 360)">
    <rect x="0" y="0" width="80" height="50" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
    <text x="40" y="20" text-anchor="middle" font-size="10" fill="#856404">MISSING</text>
    <text x="40" y="35" text-anchor="middle" font-size="9" fill="#856404">BINDS edge</text>
  </g>
  <path d="M 500 400 L 580 430" stroke="#ffc107" stroke-width="2" stroke-dasharray="8,4" fill="none"/>

  <!-- Legend -->
  <g transform="translate(750, 100)">
    <rect x="0" y="0" width="220" height="250" rx="8" fill="white" stroke="#ddd"/>
    <text x="110" y="25" text-anchor="middle" font-weight="bold" font-size="14" fill="#333">Legend</text>

    <ellipse cx="30" cy="55" rx="20" ry="12" class="entry-node"/>
    <text x="60" y="60" class="legend-text">Entry Point</text>

    <rect x="10" y="75" width="40" height="24" rx="4" class="component-node"/>
    <text x="60" y="92" class="legend-text">Component</text>

    <rect x="10" y="105" width="40" height="24" rx="4" class="handler-node"/>
    <text x="60" y="122" class="legend-text">Handler</text>

    <rect x="10" y="135" width="40" height="24" rx="4" class="function-node"/>
    <text x="60" y="152" class="legend-text">Function</text>

    <rect x="10" y="165" width="40" height="24" rx="4" class="dead-node"/>
    <text x="60" y="182" class="legend-text">Dead Code</text>

    <line x1="10" y1="205" x2="50" y2="205" stroke="#4a4a6a" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="60" y="210" class="legend-text">Reachable Edge</text>

    <line x1="10" y1="230" x2="50" y2="230" stroke="#c0392b" stroke-width="2" stroke-dasharray="5,3"/>
    <text x="60" y="235" class="legend-text">Dead Path</text>
  </g>

  <!-- Cut Set Explanation -->
  <g transform="translate(750, 380)">
    <rect x="0" y="0" width="220" height="150" rx="8" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
    <text x="110" y="25" text-anchor="middle" font-weight="bold" font-size="13" fill="#856404">Cut Set Explanation</text>

    <text x="15" y="50" font-size="11" fill="#856404">handleDelete is UNREACHABLE</text>
    <text x="15" y="70" font-size="11" fill="#856404">because:</text>
    <text x="15" y="95" font-size="10" fill="#856404">• No BINDS edge from any</text>
    <text x="15" y="110" font-size="10" fill="#856404">  component to handleDelete</text>
    <text x="15" y="130" font-size="10" fill="#856404">• deleteItem is also DEAD</text>
    <text x="15" y="145" font-size="10" fill="#856404">  (only called by dead handler)</text>
  </g>

  <!-- Version -->
  <text x="980" y="690" text-anchor="end" font-size="10" fill="#999">CodeTruth-MCP Reachability Graph v1.0</text>
</svg>
